[workspace]
members = ["adapters/blockchain/core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AgronetLabs"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/agronetlabs/ATF-AI"
description = "ATF-AI ERC-8040 blockchain adapter core"
keywords = ["atf-ai", "erc8040", "esg", "compliance", "provenance"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
